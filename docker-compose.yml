version: '3.8'

services:
  farmora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmora-ai
    ports:
      - "80:80"
    environment:
      # Project Configuration
      - PROJECT_NAME=${PROJECT_NAME:-Farmora AI}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      
      # MongoDB connection
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME:-farmora_db}
      
      # AI Provider Keys
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # External API Keys
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
    env_file:
      - farmora_backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# For production with external MongoDB
# networks:
#   default:
#     external:
#       name: farmora-network
